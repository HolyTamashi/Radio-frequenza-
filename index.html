<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RADIO FREQUENCY • LIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(22, 27, 34, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-neon: #a855f7;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px 40px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 60%, rgba(6, 182, 212, 0.12) 0%, transparent 45%);
    }

    /* Container centrale */
    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header & Badge Live */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 6px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.6s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.4); }
    }

    /* Player Card Glassmorphism */
    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 24px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      position: relative;
      overflow: hidden;
    }

    .cover-container {
      width: 170px;
      height: 170px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .cover-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .playing .cover-container img {
      animation: slowRotate 24s linear infinite;
    }

    @keyframes slowRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Visualizer Canvas */
    #visualizer {
      width: 100%;
      height: 48px;
      margin-bottom: 12px;
      border-radius: 8px;
    }

    .show-info {
      text-align: center;
      margin-bottom: 20px;
    }

    .show-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .dj-name {
      font-size: 0.85rem;
      color: var(--accent-cyan);
      font-weight: 600;
    }

    /* Controlli Audio */
    .controls {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 18px;
    }

    .play-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-neon), var(--accent-pink));
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .play-btn:active {
      transform: scale(0.92);
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
    }

    .play-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    /* Barra del Volume */
    .volume-box {
      width: 85%;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .volume-box svg {
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
    }

    .volume-slider {
      flex: 1;
      height: 5px;
      accent-color: var(--accent-cyan);
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      outline: none;
    }

    /* Barra Reazioni Rapide */
    .reactions-bar {
      display: flex;
      justify-content: space-around;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 10px 14px;
      backdrop-filter: blur(15px);
    }

    .react-btn {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 12px;
      transition: transform 0.1s ease, background 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .react-btn span {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .react-btn:active {
      transform: scale(1.3);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Elemento particella reazione */
    .floating-emoji {
      position: fixed;
      pointer-events: none;
      font-size: 2rem;
      z-index: 9999;
      animation: floatUp 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.6); }
      50% { opacity: 0.9; transform: translateY(-120px) scale(1.2) rotate(10deg); }
      100% { opacity: 0; transform: translateY(-240px) scale(1.5) rotate(-15deg); }
    }

    /* Bacheca Dediche e Interazione */
    .chat-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: 22px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .messages-feed {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .msg-bubble {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 8px 12px;
      border-radius: 12px;
      font-size:
